[project]
name = "trading-swarm-consumer"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "pika>=1.3.0",
    "docker>=7.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.scripts]
swarm-consumer = "swarm_consumer.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
